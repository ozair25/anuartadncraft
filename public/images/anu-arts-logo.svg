<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" fill="none" className="w-full h-auto">
  <defs>
    <!-- Butterfly Gradients -->
    <linearGradient id="butterflyPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B1FA2" />
      <stop offset="60%" stop-color="#6A1B9A" />
      <stop offset="100%" stop-color="#4A148C" />
    </linearGradient>
    <linearGradient id="butterflyLilac" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1BEE7" />
      <stop offset="100%" stop-color="#BA68C8" />
    </linearGradient>

    <!-- Eucalyptus Leaf Watercolor Gradients & Filters -->
    <linearGradient id="eucLeaf1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8DBBA5" />
      <stop offset="50%" stop-color="#5E967D" />
      <stop offset="100%" stop-color="#3D6E57" />
    </linearGradient>
    <linearGradient id="eucLeaf2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B2D8C6" />
      <stop offset="60%" stop-color="#7AAFA0" />
      <stop offset="100%" stop-color="#4A7C6B" />
    </linearGradient>
    <linearGradient id="eucLeaf3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#68A288" />
      <stop offset="100%" stop-color="#2D5843" />
    </linearGradient>
    <linearGradient id="eucStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7E9F8E" />
      <stop offset="100%" stop-color="#406351" />
    </linearGradient>
  </defs>

  <!-- ==================== 1. PURPLE BUTTERFLY (LEFT) ==================== -->
  <g id="butterfly-logo-mark" transform="translate(12, 10)">
    <!-- Upper Main Wing (Outer Loop) -->
    <path
      d="M 125 108 C 115 80, 105 38, 126 22 C 145 7, 168 18, 168 42 C 168 70, 142 98, 125 108 Z"
      fill="none"
      stroke="url(#butterflyPurple)"
      stroke-width="13"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <!-- Upper Wing Inner Petal (Lilac Fill) -->
    <path
      d="M 136 94 C 132 82, 129 65, 137 57 C 143 51, 150 56, 149 66 C 148 78, 141 89, 136 94 Z"
      fill="url(#butterflyLilac)"
      opacity="0.9"
    />

    <!-- Left Large Wing (Outer Loop) -->
    <path
      d="M 115 110 C 85 108, 22 96, 16 68 C 10 42, 45 35, 78 52 C 106 67, 118 95, 115 110 Z"
      fill="url(#butterflyPurple)"
    />
    <!-- Left Large Wing Inner Cutout Shape -->
    <path
      d="M 98 94 C 82 86, 42 70, 36 60 C 32 52, 46 47, 65 55 C 84 64, 98 83, 98 94 Z"
      fill="#FFFFFF"
    />

    <!-- Lower Wing (Outer Loop) -->
    <path
      d="M 116 118 C 95 125, 68 142, 68 160 C 68 178, 92 184, 106 172 C 122 158, 124 132, 116 118 Z"
      fill="none"
      stroke="url(#butterflyPurple)"
      stroke-width="11"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <!-- Lower Wing Inner Petal (Lilac Fill) -->
    <path
      d="M 111 128 C 98 136, 86 148, 88 158 C 90 164, 100 163, 106 156 C 112 147, 112 135, 111 128 Z"
      fill="url(#butterflyLilac)"
      opacity="0.9"
    />

    <!-- Butterfly Antennae & Head Dots -->
    <!-- Top Antenna -->
    <path
      d="M 134 98 C 148 94, 165 85, 175 72 C 182 63, 182 52, 172 52 C 165 52, 164 60, 168 64"
      fill="none"
      stroke="url(#butterflyPurple)"
      stroke-width="3.5"
      stroke-linecap="round"
    />
    <circle cx="170" cy="58" r="4.5" fill="#6A1B9A" />

    <!-- Bottom Antenna -->
    <path
      d="M 136 106 C 152 108, 172 110, 185 104 C 195 99, 196 90, 188 88 C 182 86, 180 93, 184 96"
      fill="none"
      stroke="url(#butterflyPurple)"
      stroke-width="3.2"
      stroke-linecap="round"
    />
    <circle cx="186" cy="92" r="4" fill="#6A1B9A" />

    <!-- Butterfly Curved Body / Tail & Center Dot -->
    <circle cx="127" cy="112" r="4.5" fill="#6A1B9A" />
    <path
      d="M 124 116 C 118 126, 110 138, 112 148 C 113 154, 118 152, 119 148"
      fill="none"
      stroke="url(#butterflyPurple)"
      stroke-width="4"
      stroke-linecap="round"
    />
    <circle cx="114" cy="151" r="3" fill="#6A1B9A" />
  </g>

  <!-- ==================== 2. BOTANICAL EUCALYPTUS WATERCOLOR SPRIG ==================== -->
  <g id="eucalyptus-sprig" transform="translate(330, 8)">
    <!-- Main Arching Stem -->
    <path
      d="M 32 122 C 34 100, 36 70, 48 44 C 54 30, 62 18, 70 8"
      fill="none"
      stroke="url(#eucStem)"
      stroke-width="2.5"
      stroke-linecap="round"
    />
    <!-- Left Branchlet -->
    <path
      d="M 40 85 C 26 78, 14 74, 2 72"
      fill="none"
      stroke="url(#eucStem)"
      stroke-width="1.8"
      stroke-linecap="round"
    />
    <!-- Right Branchlet -->
    <path
      d="M 46 56 C 58 52, 70 50, 82 52"
      fill="none"
      stroke="url(#eucStem)"
      stroke-width="1.8"
      stroke-linecap="round"
    />

    <!-- Eucalyptus Coin Leaves (Layered with realistic watercolor feel) -->
    <!-- Topmost mini leaves -->
    <path
      d="M 68 8 C 72 2, 77 4, 76 10 C 75 16, 68 18, 66 12 Z"
      fill="url(#eucLeaf2)"
      opacity="0.85"
    />
    <path
      d="M 63 15 C 68 11, 74 13, 73 19 C 72 24, 64 25, 61 20 Z"
      fill="url(#eucLeaf1)"
      opacity="0.9"
    />

    <!-- Upper Middle Leaves -->
    <ellipse cx="56" cy="27" rx="7" ry="9" transform="rotate(-25 56 27)" fill="url(#eucLeaf2)" opacity="0.9" />
    <ellipse cx="68" cy="32" rx="8" ry="10" transform="rotate(20 68 32)" fill="url(#eucLeaf1)" opacity="0.95" />
    <ellipse cx="50" cy="42" rx="9" ry="11" transform="rotate(-35 50 42)" fill="url(#eucLeaf3)" opacity="0.92" />
    <ellipse cx="64" cy="46" rx="10" ry="12" transform="rotate(30 64 46)" fill="url(#eucLeaf2)" opacity="0.9" />

    <!-- Central Eucalyptus Cluster -->
    <ellipse cx="42" cy="58" rx="11" ry="13" transform="rotate(-40 42 58)" fill="url(#eucLeaf1)" opacity="0.95" />
    <ellipse cx="60" cy="62" rx="12" ry="14" transform="rotate(25 60 62)" fill="url(#eucLeaf3)" opacity="0.9" />
    <ellipse cx="76" cy="54" rx="9" ry="11" transform="rotate(45 76 54)" fill="url(#eucLeaf2)" opacity="0.85" />

    <!-- Left lower branch leaves -->
    <path
      d="M 12 75 C 6 68, 8 58, 18 60 C 26 62, 28 72, 20 78 Z"
      fill="url(#eucLeaf2)"
      opacity="0.9"
    />
    <path
      d="M 2 72 C -3 66, 0 57, 8 58 C 15 59, 16 68, 9 73 Z"
      fill="url(#eucLeaf1)"
      opacity="0.85"
    />
    <ellipse cx="28" cy="74" rx="11" ry="13" transform="rotate(-20 28 74)" fill="url(#eucLeaf3)" opacity="0.92" />

    <!-- Lower cluster leaves -->
    <ellipse cx="38" cy="78" rx="12" ry="14" transform="rotate(-15 38 78)" fill="url(#eucLeaf1)" opacity="0.95" />
    <ellipse cx="54" cy="82" rx="13" ry="15" transform="rotate(15 54 82)" fill="url(#eucLeaf2)" opacity="0.9" />
    <ellipse cx="32" cy="96" rx="13" ry="15" transform="rotate(-30 32 96)" fill="url(#eucLeaf3)" opacity="0.92" />
    <ellipse cx="48" cy="102" rx="14" ry="16" transform="rotate(20 48 102)" fill="url(#eucLeaf1)" opacity="0.95" />

    <!-- Delicate leaf vein accents -->
    <path d="M 48 44 Q 54 38 60 30" stroke="#FFFFFF" stroke-width="0.8" opacity="0.5" fill="none" />
    <path d="M 42 58 Q 48 52 54 48" stroke="#FFFFFF" stroke-width="0.8" opacity="0.5" fill="none" />
    <path d="M 32 96 Q 38 90 44 86" stroke="#FFFFFF" stroke-width="0.8" opacity="0.4" fill="none" />
  </g>

  <!-- ==================== 3. CALLIGRAPHIC SCRIPT: "Anu Arts" ==================== -->

    <!-- "Anu" -->
    <!-- Capital 'A' Swash & Loop -->
    <path
      d="M 178 148 C 172 152, 160 156, 150 152 C 140 148, 138 136, 146 128 C 158 116, 182 118, 198 126 C 214 134, 218 152, 206 160 C 196 166, 178 166, 164 158 C 148 148, 144 128, 156 108 C 172 82, 208 58, 240 60 C 254 62, 260 74, 252 88 C 242 106, 222 136, 212 162 C 210 166, 216 168, 220 164 C 228 156, 234 140, 238 126 C 242 112, 245 92, 246 76 C 247 62, 240 54, 228 54 C 198 54, 166 84, 150 114 C 138 138, 140 162, 162 174 C 182 184, 210 182, 228 168 C 238 160, 242 148, 246 136 C 248 146, 256 156, 266 158 C 276 160, 286 154, 292 144 C 298 134, 300 120, 296 112 C 292 104, 282 108, 280 116 C 278 126, 276 138, 270 144 C 266 148, 260 146, 258 140 C 256 130, 260 116, 264 104 C 270 86, 278 72, 286 72 C 292 72, 290 82, 286 94 C 280 114, 272 136, 276 150 C 278 156, 284 158, 290 154 C 300 146, 308 132, 314 118 L 324 148 C 328 156, 336 160, 344 158 C 354 154, 362 142, 368 130 C 374 118, 378 104, 374 98 C 370 92, 362 96, 360 104 C 358 114, 354 126, 348 134 C 344 140, 338 140, 336 134 C 334 124, 338 112, 342 98 C 348 78, 356 64, 364 64 C 370 64, 368 76, 362 90 C 356 108, 348 132, 354 144 C 356 148, 362 148, 368 144 C 378 134, 386 118, 394 102 L 398 124 C 402 142, 414 156, 430 156 C 446 156, 458 142, 468 126 C 474 116, 470 108, 462 108 C 454 108, 448 118, 442 128 C 438 134, 432 136, 428 132 C 422 124, 422 110, 426 94 C 432 72, 442 56, 452 56 C 458 56, 456 68, 450 82 C 442 102, 434 126, 440 140 C 444 146, 452 146, 458 140 C 468 128, 476 112, 484 94 L 476 94 Z"
    />

    <!-- "Arts" -->
    <!-- Capital 'A' of Arts -->
    <path
      d="M 436 132 C 428 146, 412 162, 394 162 C 382 162, 376 152, 382 138 C 392 116, 418 84, 446 62 C 464 48, 482 46, 492 56 C 500 64, 498 78, 488 94 C 476 114, 452 140, 436 158 C 426 170, 412 178, 396 178 C 374 178, 360 162, 366 138 C 374 108, 400 76, 428 54 C 448 38, 472 32, 490 40 C 508 48, 514 68, 502 92 C 490 116, 466 144, 448 162 C 442 168, 448 172, 454 168 C 466 158, 478 144, 488 128 C 494 118, 492 110, 484 110 C 476 110, 470 120, 462 132 L 458 142 Z"
    />
    <!-- 'r' -->
    <path
      d="M 496 142 C 494 148, 490 154, 484 154 C 478 154, 474 148, 476 138 C 480 122, 488 104, 496 90 C 500 82, 506 78, 514 80 C 522 82, 528 90, 524 98 C 520 106, 512 112, 506 114 C 508 112, 514 108, 520 106 C 528 104, 536 108, 538 116 C 540 126, 534 138, 526 146 C 518 154, 508 156, 502 150 C 498 146, 496 138, 498 130 C 502 114, 510 102, 514 102 C 516 102, 514 108, 510 116 C 504 128, 498 142, 496 150 Z"
    />
    <!-- 't' -->
    <path
      d="M 528 148 C 524 154, 518 156, 512 154 C 506 150, 508 138, 514 122 C 522 100, 534 68, 542 52 C 546 44, 554 44, 554 52 C 554 60, 548 76, 542 94 L 560 90 C 564 88, 568 92, 566 96 C 564 100, 558 104, 552 106 L 536 110 C 528 130, 522 144, 528 148 Z"
    />
    <!-- 's' -->
    <path
      d="M 552 142 C 548 148, 542 154, 534 154 C 526 154, 524 146, 528 136 C 534 120, 546 102, 558 92 C 566 84, 576 82, 582 88 C 588 94, 586 106, 578 118 C 568 132, 550 148, 536 154 C 532 156, 534 162, 540 160 C 554 154, 572 138, 584 122 C 594 108, 598 94, 590 84 C 580 72, 564 74, 550 86 C 536 98, 524 120, 518 138 C 512 158, 522 168, 538 166 C 550 164, 562 154, 570 142 L 552 142 Z"
    />
  </g>

  <!-- ==================== 4. TRADEMARK (TM) ==================== -->
  <g id="trademark-tm" transform="translate(562, 70)">
    <text
      x="0"
      y="0"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="16"
      font-weight="900"
      fill="#111827"
      letter-spacing="0.5"
    >
      TM
    </text>
  </g>
</svg>
